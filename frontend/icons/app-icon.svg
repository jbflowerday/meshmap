    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a33"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g stroke="#34d399" stroke-width="22" stroke-linecap="round">
    <line x1="146" y1="348" x2="256" y2="144"/>
    <line x1="256" y1="144" x2="366" y2="332"/>
    <line x1="146" y1="348" x2="366" y2="332"/>
  </g>
  <g fill="#34d399" stroke="#0b1120" stroke-width="10">
    <circle cx="146" cy="348" r="50"/>
    <circle cx="256" cy="144" r="50"/>
    <circle cx="366" cy="332" r="50"/>
  </g>
