name: meshmap

services:
  mosquitto:
    build: ./mosquitto
    restart: unless-stopped
    environment:
      MQTT_ROOT_TOPIC: ${MQTT_ROOT_TOPIC:-msh}
      MQTT_BACKEND_USER: ${MQTT_BACKEND_USER:-meshmap}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?set MQTT_BACKEND_PASSWORD in .env}
      MQTT_NODE_USER: ${MQTT_NODE_USER:-meshdev}
      MQTT_NODE_PASSWORD: ${MQTT_NODE_PASSWORD:?set MQTT_NODE_PASSWORD in .env}
      MQTT_ALLOW_ANONYMOUS: ${MQTT_ALLOW_ANONYMOUS:-false}
    ports:
      - "${MQTT_PORT:-1883}:1883" # Meshtastic nodes connect here
    volumes:
      - mosquitto-data:/mosquitto/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_BACKEND_USER:-meshmap}
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      MQTT_TOPICS: ${MQTT_TOPICS:-msh/#}
      MESH_CHANNEL_KEYS: ${MESH_CHANNEL_KEYS:-AQ==}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      NODE_MAX_AGE_DAYS: ${NODE_MAX_AGE_DAYS:-30}
      LINK_MAX_AGE_HOURS: ${LINK_MAX_AGE_HOURS:-72}
      MIN_PRECISION_BITS: ${MIN_PRECISION_BITS:-0}
      NAME_REQUESTS: ${NAME_REQUESTS:-false}
      NAME_REQUEST_MAX_PER_HOUR: ${NAME_REQUEST_MAX_PER_HOUR:-6}
      NAME_REQUEST_RETRY_HOURS: ${NAME_REQUEST_RETRY_HOURS:-12}
      NAME_REQUEST_NODE_ID: ${NAME_REQUEST_NODE_ID:-}
      NAME_REQUEST_LONG_NAME: ${NAME_REQUEST_LONG_NAME:-MeshMap}
      NAME_REQUEST_SHORT_NAME: ${NAME_REQUEST_SHORT_NAME:-MMap}
      AUTO_TRACEROUTES: ${AUTO_TRACEROUTES:-false}
      TRACEROUTE_MAX_PER_HOUR: ${TRACEROUTE_MAX_PER_HOUR:-4}
      TRACEROUTE_MIN_INTERVAL_SECONDS: ${TRACEROUTE_MIN_INTERVAL_SECONDS:-300}
      TRACEROUTE_RETRY_HOURS: ${TRACEROUTE_RETRY_HOURS:-24}
      TRACEROUTE_HEARD_WITHIN_MINUTES: ${TRACEROUTE_HEARD_WITHIN_MINUTES:-60}
      TRACEROUTE_MIN_HOPS_AWAY: ${TRACEROUTE_MIN_HOPS_AWAY:-1}
      TRACEROUTE_MAX_HOPS_AWAY: ${TRACEROUTE_MAX_HOPS_AWAY:-3}
      TRACEROUTE_HOP_LIMIT: ${TRACEROUTE_HOP_LIMIT:-3}
    volumes:
      - backend-data:/data
    # Not published: the frontend proxies /api and /ws to it.
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SITE_TITLE: ${SITE_TITLE:-MeshMap}
        VITE_MAP_CENTER: ${MAP_CENTER:-}
        VITE_MAP_ZOOM: ${MAP_ZOOM:-}
        VITE_TILE_URL: ${TILE_URL:-}
        VITE_TILE_ATTRIBUTION: ${TILE_ATTRIBUTION:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mosquitto-data:
  backend-data:
