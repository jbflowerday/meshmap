# MeshMap broker. Credentials and ACL are generated at startup by entrypoint.sh
# from environment variables (see .env.example).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

listener 1883
protocol mqtt

password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# Meshtastic packets are small; cap payloads to limit abuse.
max_packet_size 16384
max_inflight_messages 20
max_queued_messages 1000

include_dir /mosquitto/config/conf.d
